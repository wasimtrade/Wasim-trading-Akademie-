const VN=[[
"Willkommen in der Wasim Trading Akademie. In diesem Video lernst du, was eine Fair Value Gap ist, warum sie so wichtig ist und wie du sie im Chart findest. Schau dir zuerst den ruhigen Markt an.",

"Eine Fair Value Gap besteht immer aus drei Kerzen. Kerze eins ist die Kerze vor dem Impuls, Kerze zwei ist die große Impulskerze, und Kerze drei ist die Kerze danach.",
"Jetzt kommt die Regel: Bei einer bullishen Fair Value Gap liegt zwischen dem Hoch der ersten Kerze und dem Tief der dritten Kerze eine Lücke. Dort wurde kaum gehandelt. Genau diesen Bereich markierst du als Rechteck.",

"In diesem Video geht es um den Liquidity Sweep, also das Abgreifen von Liquidität. Das ist eines der wichtigsten Konzepte, um zu verstehen, warum der Markt oft kurz in die falsche Richtung läuft.",

"Große Marktteilnehmer brauchen Liquidität, um ihre eigenen Orders zu füllen. Deshalb zieht der Preis gezielt in solche Bereiche.",

"Heute lernst du den Market Structure Break, kurz MSB. Er zeigt dir, wann ein Trend seine Richtung ändern könnte.",
"Zuerst die Basis: Ein Abwärtstrend besteht aus tieferen Hochs und tieferen Tiefs. Jeder Anstieg wird verkauft, bevor das letzte Hoch erreicht wird.",
"Das letzte tiefere Hoch ist unser Schlüsselniveau. Solange der Preis darunter bleibt, ist der Abwärtstrend intakt.",
"Jetzt schließt eine starke Kerze über diesem Hoch. Das ist der Market Structure Break. Die Käufer haben zum ersten Mal die Kontrolle übernommen.",

"Ein Break ist noch kein Einstieg. Warte auf einen Rücksetzer, zum Beispiel in eine Fair Value Gap oder einen Order Block. Übe das jetzt im Labor."],[
"In diesem Video erkläre ich dir den Order Block, eine Zone, in der große Marktteilnehmer ihre Orders platziert haben.",
"Der Markt fällt, und am Ende entsteht eine letzte rote Kerze. Merke dir diese Kerze gut.",
"Danach folgt ein kraftvoller Impuls nach oben, der die Struktur bricht. Das zeigt, dass hier starke Käufer eingestiegen sind.",
"Die letzte rote Kerze vor diesem Impuls ist der bullishe Order Block. Du markierst sie vom Hoch bis zum Tief als Rechteck.",

"Jetzt geht es um Premium und Discount. Mit diesem Konzept kaufst du günstig und verkaufst teuer, statt jedem Preis hinterherzulaufen.",

"Jetzt teilen wir die Range in der Mitte. Diese 50-Prozent-Marke heißt Equilibrium, also das Gleichgewicht.",
"Alles oberhalb davon ist Premium, der Preis ist teuer. Alles darunter ist Discount, der Preis ist günstig.",
"In einem Aufwärtstrend suchst du Käufe im Discount, nicht im Premium. Der Preis fällt zurück in die untere Hälfte, und dort entsteht die Reaktion nach oben.",
